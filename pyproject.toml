[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facet"
dynamic = ["version"]
description = "A light 3D model viewer (STL, OBJ, PLY, 3MF) with precise measuring"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "quezka-ui"]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.gui-scripts]
facet = "facet.app:main"

[tool.setuptools.dynamic]
version = {attr = "facet.__version__"}

[tool.setuptools.packages.find]
include = ["facet*"]

[tool.setuptools.package-data]
facet = ["assets/*"]
